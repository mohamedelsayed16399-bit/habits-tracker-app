<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e1b4b">
<title>عاداتي - متتبع العادات</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(#1e1b4b,#0f172a);background-attachment:fixed;color:#f1f5f9;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;padding-bottom:100px}
.wrap{max-width:540px;margin:auto;padding:16px}
h1{margin:4px 0 2px;font-size:22px}
.sub{color:#a5b4fc;font-size:14px;margin-bottom:14px}
.sum{display:flex;gap:10px;margin-bottom:14px}
.sum div{flex:1;background:#ffffff14;border-radius:16px;padding:12px;text-align:center}
.sum b{display:block;font-size:26px}
.sum span{font-size:12px;color:#c7d2fe}
.ring{height:10px;background:#ffffff1a;border-radius:6px;overflow:hidden;margin-bottom:16px}
.ring i{display:block;height:100%;background:linear-gradient(90deg,#818cf8,#34d399);transition:.5s}
.h{background:#ffffff12;border-radius:18px;padding:14px;margin-bottom:12px}
.top{display:flex;align-items:center;gap:12px}
.ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:17px}
.nm span{font-size:13px;color:#c7d2fe}
.chk{width:54px;height:54px;border-radius:50%;border:3px solid #818cf8;background:none;color:#fff;font-size:26px;transition:.2s}
.chk.on{background:#34d399;border-color:#34d399;transform:scale(1.08)}
.week{display:flex;gap:5px;margin-top:12px;justify-content:space-between}
.d{flex:1;text-align:center;font-size:11px;color:#94a3b8}
.d i{display:block;height:26px;border-radius:8px;background:#ffffff14;margin-top:3px}
.d i.on{background:#818cf8}
.d.t{color:#fff;font-weight:700}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:3px;background:#ffffff10}
.del{background:none;border:0;color:#64748b;font-size:13px;margin-top:8px;font-family:inherit}
.bar2{display:flex;gap:8px;margin-bottom:12px}
.bar2 button,.ed{background:#ffffff14;border:0;color:#c7d2fe;border-radius:10px;padding:8px 12px;font-size:13px;font-family:inherit}
.ed{background:none;padding:0;margin-top:8px;margin-inline-end:14px;color:#a5b4fc}
.d{cursor:pointer}
.pc{font-size:12px;color:#a5b4fc;margin-top:6px}
.msg{background:#34d39922;border:1px solid #34d39966;color:#a7f3d0;border-radius:14px;padding:10px;text-align:center;margin-bottom:12px;font-size:14px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#0f172a;border:1px solid #4338ca;border-radius:14px;padding:10px 16px;display:none;gap:14px;align-items:center;z-index:8;font-size:14px;white-space:nowrap}
.toast button{background:none;border:0;color:#818cf8;font-weight:800;font-family:inherit;font-size:14px}
.fab{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#818cf8;color:#1e1b4b;border:0;border-radius:30px;padding:16px 34px;font-size:18px;font-weight:800;font-family:inherit;box-shadow:0 8px 24px #0008}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:5}
.modal.on{display:flex}
.sheet{background:#1e1b4b;width:100%;max-width:540px;margin:auto;border-radius:24px 24px 0 0;padding:18px}
input{width:100%;background:#0f172a;border:1px solid #4338ca;color:#fff;border-radius:12px;padding:14px;font-size:18px;margin-bottom:12px;font-family:inherit}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.opts button{width:46px;height:46px;border-radius:14px;border:2px solid transparent;background:#0f172a;font-size:22px}
.opts button.on{border-color:#fff}
.cl{width:34px!important;height:34px!important;border-radius:50%!important}
.go{width:100%;background:#818cf8;color:#1e1b4b;border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:800;font-family:inherit}
.lvl{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:18px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.lvl .n{width:56px;height:56px;border-radius:50%;background:#ffffff26;display:grid;place-items:center;font-size:26px;font-weight:900}
.lvl .t{flex:1}.lvl .t b{font-size:17px;display:block}.lvl .t span{font-size:12px;color:#e0e7ff}
.lvl .xb{height:8px;background:#ffffff30;border-radius:5px;overflow:hidden;margin-top:6px}.lvl .xb i{display:block;height:100%;background:#fde68a;transition:.5s}
.card2{background:#ffffff12;border-radius:18px;padding:14px;margin-bottom:12px}
.bh{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bd{text-align:center;font-size:11px;color:#c7d2fe;background:#ffffff0d;border-radius:12px;padding:8px 2px}
.bd span{display:block;font-size:26px;margin-bottom:2px}
.bd.off{opacity:.35;filter:grayscale(1)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:15px;gap:6px;text-align:center}
.ch button{background:#ffffff14;border:0;color:#fff;border-radius:10px;width:42px;height:38px;font-size:20px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:10px}
.cgrid em{font-style:normal;font-size:11px;color:#94a3b8;text-align:center}
.cgrid button{aspect-ratio:1;border:2px solid transparent;border-radius:10px;background:#ffffff12;color:#e2e8f0;font-size:14px;font-family:inherit;padding:0}
.cgrid button:disabled{opacity:.25}
.cgrid button.td{border-color:#fff}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
</style>
</head>
<body>
<canvas id="cf"></canvas><div class="toast" id="toast"><span id="tm"></span><button id="tu">تراجع</button></div>
<div class="wrap">
  <h1>🌱 عاداتي</h1><div class="sub" id="date"></div>
  <div class="sum"><div><b id="s1">٠</b><span>تمت النهارده</span></div><div><b id="s2">٠</b><span>أطول سلسلة 🔥</span></div><div><b id="s3">٠٪</b><span>هذا الأسبوع</span></div></div>
  <div class="lvl" id="lvl"></div><div id="mg"></div><div class="ring"><i id="rg" style="width:0"></i></div>
  <div class="bar2"><button id="exp">⬇️ نسخة احتياطية</button><button id="imp">⬆️ استرجاع</button><input type="file" id="impf" accept=".json,application/json" hidden></div>
  <div class="card2"><div class="bh"><span>🏅 الإنجازات</span><span id="bc"></span></div><div class="bgrid" id="bg"></div></div>
  <div id="list"></div>
</div>
<div class="modal" id="calm"><div class="sheet"><div class="ch"><button id="cpv">›</button><b id="cti"></b><button id="cnx">‹</button></div><div class="cgrid" id="cg"></div><div class="pc" id="cst" style="text-align:center;margin-bottom:8px"></div><button class="del" id="ccl" style="width:100%">إغلاق</button></div></div>
<button class="fab" id="add">+ عادة جديدة</button>
<div class="modal" id="modal"><div class="sheet">
  <input id="nm" placeholder="اسم العادة (مثلاً: اشرب مية)" maxlength="30">
  <div class="opts" id="ics"></div><div class="opts" id="cls"></div>
  <div id="edt" style="display:none;color:#a5b4fc;font-size:13px;margin-bottom:8px">تعديل العادة</div><button class="go" id="save">حفظ</button><button class="del" id="cx" style="width:100%">إلغاء</button>
</div></div>
<script>
const $=id=>document.getElementById(id);
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const ICONS=["💧","📚","🏃","🧘","🥗","😴","🕌","✍️","💪","🎯","🦷","🚭","🚶","💊","🧹","📵","☀️","❤️","🎨","🎧"],COLS=["#818cf8","#34d399","#f472b6","#fbbf24","#38bdf8","#fb923c"];
const DN=["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"],MN=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
let S;try{S=JSON.parse(localStorage.getItem("habits1")||"null")}catch(e){}S=S||{h:[]};
const save=()=>localStorage.setItem("habits1",JSON.stringify(S));
const dk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const back=n=>{const d=new Date();d.setDate(d.getDate()-n);return d};
const streak=h=>{let n=0,i=h.l[dk(back(0))]?0:1;while(h.l[dk(back(i))]){n++;i++}return n};
const best=h=>{const ks=Object.keys(h.l).sort();let b=0,c=0,p=null;ks.forEach(k=>{const d=new Date(k+"T00:00:00");if(p&&Math.round((d-p)/864e5)==1)c++;else c=1;b=Math.max(b,c);p=d});return b};
const TITLES=["مبتدئ","متحمس","منتظم","ملتزم","محترف","بطل","أسطورة","خارق"];
function gstats(){const ks=new Set();S.h.forEach(h=>Object.keys(h.l).forEach(k=>ks.add(k)));let t=0;S.h.forEach(h=>t+=Object.keys(h.l).length);
  let p=0;if(S.h.length>=2)ks.forEach(k=>{if(S.h.every(h=>h.l[k]))p++});return{t,b:Math.max(0,...S.h.map(best)),p}}
const BADGES=[["f1","🌱","أول خطوة",g=>g.t>=1],["t10","⭐","١٠ أيام تسجيل",g=>g.t>=10],["t50","🌟","٥٠ تسجيل",g=>g.t>=50],["t100","💯","١٠٠ تسجيل",g=>g.t>=100],["t365","👑","٣٦٥ تسجيل",g=>g.t>=365],
 ["s3","🔥","٣ أيام ورا بعض",g=>g.b>=3],["s7","🚀","أسبوع كامل",g=>g.b>=7],["s21","💪","٢١ يوم",g=>g.b>=21],["s30","🏆","شهر كامل",g=>g.b>=30],["s100","💎","١٠٠ يوم",g=>g.b>=100],
 ["h3","🧩","٣ عادات",g=>S.h.length>=3],["pd","🎉","يوم مثالي",g=>g.p>=1],["pd7","🌈","٧ أيام مثالية",g=>g.p>=7]];
const lvOf=xp=>Math.floor((1+Math.sqrt(1+xp/12.5))/2);
function award(announce){S.b=S.b||{};const g=gstats(),xp=g.t*10+g.p*20,L=lvOf(xp);const nw=[];
  BADGES.forEach(b=>{if(!S.b[b[0]]&&b[3](g)){S.b[b[0]]=Date.now();nw.push(b)}});
  const old=S.lv||1;S.lv=Math.max(old,L);save();
  if(announce){if(nw.length){flash("🏅 إنجاز جديد: "+nw.map(b=>b[1]+" "+b[2]).join("، "));confetti($("lvl"))}else if(L>old)flash("⬆️ وصلت مستوى "+AR(L)+": "+TITLES[Math.min(L-1,7)])}}
function renderGam(){const g=gstats(),xp=g.t*10+g.p*20,L=lvOf(xp),lo=50*L*(L-1),hi=50*L*(L+1);
  $("lvl").innerHTML=`<div class="n">${AR(L)}</div><div class="t"><b>${TITLES[Math.min(L-1,7)]}</b><span>${AR(xp)} نقطة خبرة · باقي ${AR(hi-xp)} للمستوى ${AR(L+1)}</span><div class="xb"><i style="width:${Math.round((xp-lo)/(hi-lo)*100)}%"></i></div></div>`;
  const B=S.b||{};$("bc").textContent=AR(BADGES.filter(b=>B[b[0]]).length)+"/"+AR(BADGES.length);
  $("bg").innerHTML=BADGES.map(b=>`<div class="bd ${B[b[0]]?"":"off"}"><span>${b[1]}</span>${b[2]}</div>`).join("")}
let calI=-1,calD=new Date();
function openCal(i){calI=i;calD=new Date();calD.setDate(1);renderCal();$("calm").classList.add("on")}
function renderCal(){const h=S.h[calI];if(!h)return;const y=calD.getFullYear(),m=calD.getMonth(),dim=new Date(y,m+1,0).getDate(),off=new Date(y,m,1).getDay(),now=new Date(),tk=dk(now);
  $("cti").textContent=h.i+" "+h.n+" · "+MN[m]+" "+AR(y);let html=DN.map(d=>`<em>${d.slice(0,3)}</em>`).join("");for(let k=0;k<off;k++)html+="<em></em>";let cnt=0,past=0;
  for(let d=1;d<=dim;d++){const dt=new Date(y,m,d),k=dk(dt),fut=dt>now&&k!=tk,on=!!h.l[k];if(on)cnt++;if(!fut)past++;
   html+=`<button data-k="${k}" class="${k==tk?"td":""}" ${fut?"disabled":""} style="${on?"background:"+h.c+";color:#0f172a;font-weight:800":""}">${AR(d)}</button>`}
  $("cg").innerHTML=html;$("cst").textContent=AR(cnt)+" يوم من "+AR(past)+" ("+AR(past?Math.round(cnt/past*100):0)+"٪)"}
$("cg").onclick=e=>{const b=e.target.closest("button[data-k]");if(!b||b.disabled)return;const h=S.h[calI],k=b.dataset.k;if(h.l[k])delete h.l[k];else h.l[k]=1;save();award(true);render();renderCal()};
$("cpv").onclick=()=>{calD.setMonth(calD.getMonth()-1);renderCal()};$("cnx").onclick=()=>{const n=new Date(calD);n.setMonth(n.getMonth()+1);if(n<=new Date()){calD=n;renderCal()}};
$("ccl").onclick=()=>$("calm").classList.remove("on");$("calm").onclick=e=>{if(e.target==$("calm"))$("calm").classList.remove("on")};
function render(){renderGam();
  const t=new Date();$("date").textContent=DN[t.getDay()]+" "+AR(t.getDate())+" "+MN[t.getMonth()];
  const td=dk(t);let done=0;S.h.forEach(h=>{if(h.l[td])done++});
  let wk=0,wt=0;S.h.forEach(h=>{for(let i=0;i<7;i++){wt++;if(h.l[dk(back(i))])wk++}});
  $("s1").textContent=AR(done)+"/"+AR(S.h.length);$("s2").textContent=AR(Math.max(0,...S.h.map(best)));$("s3").textContent=AR(wt?Math.round(wk/wt*100):0)+"٪";
  $("mg").innerHTML=S.h.length&&done==S.h.length?'<div class="msg">🎉 خلصت كل عاداتك النهارده، برافو عليك!</div>':"";
  $("rg").style.width=(S.h.length?done/S.h.length*100:0)+"%";
  $("list").innerHTML=S.h.length?S.h.map((h,i)=>{
    const wkh=[6,5,4,3,2,1,0].map(n=>{const d=back(n);return `<div class="d ${n==0?"t":""}" data-hi="${i}" data-dk="${dk(d)}">${DN[d.getDay()]}<i class="${h.l[dk(d)]?"on":""}" style="${h.l[dk(d)]?"background:"+h.c:""}"></i></div>`}).join("");
    const heat=Array.from({length:42},(_,k)=>{const d=back(41-k);return `<i style="${h.l[dk(d)]?"background:"+h.c:""}"></i>`}).join("");
    return `<div class="h"><div class="top"><div class="ic" style="background:${h.c}33">${h.i}</div><div class="nm"><b>${h.n.replace(/</g,"&lt;")}</b><span>🔥 ${AR(streak(h))} يوم · أفضل ${AR(best(h))}</span></div><button class="chk ${h.l[td]?"on":""}" data-i="${i}">${h.l[td]?"✓":""}</button></div><div class="week">${wkh}</div><div class="heat">${heat}</div><div class="pc">آخر ٣٠ يوم: ${AR(Math.round(Array.from({length:30},(_,k)=>h.l[dk(back(k))]?1:0).reduce((a,b)=>a+b,0)/30*100))}٪ · إجمالي ${AR(Object.keys(h.l).length)} يوم</div><button class="ed" data-cal="${i}">📅 التقويم</button><button class="ed" data-ed="${i}">تعديل</button><button class="del" data-del="${i}">حذف</button></div>`}).join(""):'<p style="text-align:center;color:#a5b4fc;margin:50px 0">مفيش عادات لسه. دوس "عادة جديدة" وابدأ.</p>';
}
$("list").onclick=e=>{const c=e.target.closest(".chk"),d=e.target.closest("[data-del]");
  if(c){const h=S.h[+c.dataset.i],k=dk(new Date());if(h.l[k])delete h.l[k];else{h.l[k]=1;confetti(c)}save();award(true);render()}
  else if(d){const i=+d.dataset.del,h=S.h[i];S.h.splice(i,1);save();render();undo("اتحذفت العادة",()=>{S.h.splice(i,0,h);save();render()})}
  else if(e.target.closest("[data-cal]")){openCal(+e.target.closest("[data-cal]").dataset.cal)}
  else if(e.target.closest("[data-ed]")){openEd(+e.target.closest("[data-ed]").dataset.ed)}
  else{const w=e.target.closest(".d[data-dk]");if(w){const h=S.h[+w.dataset.hi],k=w.dataset.dk;if(h.l[k])delete h.l[k];else h.l[k]=1;save();award(true);render()}}};
let ut=null,ufn=null;
function flash(m){$("tm").textContent=m;$("tu").style.display="none";ufn=null;$("toast").style.display="flex";clearTimeout(ut);ut=setTimeout(()=>{$("toast").style.display="none";$("tu").style.display=""},3800)}
function undo(m,f){$("tu").style.display="";$("tm").textContent=m;ufn=f;$("toast").style.display="flex";clearTimeout(ut);ut=setTimeout(()=>{$("toast").style.display="none";ufn=null},5000)}
$("tu").onclick=()=>{if(ufn)ufn();ufn=null;$("toast").style.display="none"};
let ed=-1;
function openEd(i){ed=i;const h=S.h[i];$("nm").value=h.n;ic=Math.max(0,ICONS.indexOf(h.i));cl=Math.max(0,COLS.indexOf(h.c));pick();$("edt").style.display="block";$("modal").classList.add("on")}
let ic=0,cl=0;
function pick(){$("ics").innerHTML=ICONS.map((x,i)=>`<button data-i="${i}" class="${i==ic?"on":""}">${x}</button>`).join("");$("cls").innerHTML=COLS.map((x,i)=>`<button data-i="${i}" class="cl ${i==cl?"on":""}" style="background:${x}"></button>`).join("")}
$("ics").onclick=e=>{const b=e.target.closest("button");if(b){ic=+b.dataset.i;pick()}};$("nm").onkeydown=e=>{if(e.key=="Enter")$("save").click()};$("cls").onclick=e=>{const b=e.target.closest("button");if(b){cl=+b.dataset.i;pick()}};
$("add").onclick=()=>{ed=-1;$("edt").style.display="none";$("nm").value="";ic=0;cl=0;pick();$("modal").classList.add("on");setTimeout(()=>$("nm").focus(),50)};
$("cx").onclick=()=>$("modal").classList.remove("on");
$("save").onclick=()=>{const n=$("nm").value.trim();if(!n){$("nm").focus();return}if(ed>=0){Object.assign(S.h[ed],{n,i:ICONS[ic],c:COLS[cl]});ed=-1}else S.h.push({n,i:ICONS[ic],c:COLS[cl],l:{}});save();$("modal").classList.remove("on");render()};
function confetti(el){const c=$("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const r=el.getBoundingClientRect(),P=[];
  for(let i=0;i<40;i++)P.push({x:r.left+r.width/2,y:r.top+r.height/2,vx:(Math.random()-.5)*10,vy:-Math.random()*10-2,c:COLS[i%6],l:1});
  (function f(){x.clearRect(0,0,c.width,c.height);let a=0;P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.l-=.02;if(p.l>0){a=1;x.globalAlpha=p.l;x.fillStyle=p.c;x.fillRect(p.x,p.y,7,7)}});if(a)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
$("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="habits-"+dk(new Date())+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("imp").onclick=()=>$("impf").click();
$("impf").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);if(!o||!Array.isArray(o.h)||o.h.some(h=>!h||typeof h.n!="string"||!h.l||typeof h.l!="object"))throw 0;if(!confirm("هيتبدّل اللي عندك بالنسخة دي. متأكد؟"))return;S=o;save();render()}).catch(()=>alert("الملف مش نسخة صحيحة"));e.target.value=""};
let lastD=dk(new Date());setInterval(()=>{if(dk(new Date())!=lastD){lastD=dk(new Date());render()}},30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden&&dk(new Date())!=lastD){lastD=dk(new Date());render()}});
